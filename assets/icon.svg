<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">AEO God Mode</title>
  <desc id="desc">A white lightning bolt on a blue rounded square, with a subtle electric pulse.</desc>
  <defs>
    <linearGradient id="blue" x1="34" y1="20" x2="224" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0875f5"/>
      <stop offset="1" stop-color="#0758e8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(88 51) rotate(48) scale(121)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bolt { transform-box: fill-box; transform-origin: center; }
      .spark { opacity: 0; color: #9edcff; filter: drop-shadow(0 0 5px rgba(158, 220, 255, .95)); }
      .spark path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
      @media (prefers-reduced-motion: no-preference) {
        .bolt { animation: charge 3.2s ease-in-out infinite; }
        .spark.one { animation: spark-one 3.2s steps(1, end) infinite; }
        .spark.two { animation: spark-two 3.2s steps(1, end) infinite; }
        .spark.three { animation: spark-three 3.2s steps(1, end) infinite; }
      }
      @keyframes charge {
        0%, 58%, 100% { transform: translate(0, 0) scale(1); filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)); }
        62% { transform: translate(-1.35px, 0) scale(1.015); filter: drop-shadow(0 0 9.43px rgba(255, 255, 255, .92)); }
        64% { transform: translate(1.35px, -1.35px) scale(1.03); filter: drop-shadow(0 0 24.25px rgba(255, 255, 255, 1)); }
        67% { transform: translate(0, 0) scale(1.008); filter: drop-shadow(0 0 12.13px rgba(255, 255, 255, .76)); }
        71% { transform: translate(0, 0) scale(1); filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)); }
      }
      @keyframes spark-one {
        0%, 59%, 61%, 65%, 100% { opacity: 0; }
        60%, 63% { opacity: 1; }
      }
      @keyframes spark-two {
        0%, 62%, 64%, 68%, 100% { opacity: 0; }
        63%, 66% { opacity: .95; }
      }
      @keyframes spark-three {
        0%, 60%, 64%, 67%, 100% { opacity: 0; }
        62%, 65% { opacity: .8; }
      }
    </style>
  </defs>
  <rect x="17.45" y="17.45" width="221.09" height="221.09" rx="48.87" fill="url(#blue)"/>
  <rect x="17.45" y="17.45" width="221.09" height="221.09" rx="48.87" fill="url(#sheen)"/>
  <svg class="bolt" x="73.31" y="51.2" width="109.38" height="153.6" viewBox="0 0 100 140" overflow="visible" aria-hidden="true">
    <path d="M58 5 18 75c-3 5 1 11 7 11h27l-10 45c-2 8 8 12 13 6l37-67c3-5-1-11-7-11H60L68 12c1-7-7-11-10-7Z" fill="#fff"/>
  </svg>
  <g aria-hidden="true">
    <g class="spark one" transform="rotate(-19 48.88 91.93)"><svg x="11.64" y="72.15" width="74.47" height="39.56" viewBox="0 0 70 40" overflow="visible"><path d="M4 25 17 13l8 10 13-17 8 15 19-12"/></svg></g>
    <g class="spark two" transform="rotate(154 212.95 172.22)"><svg x="175.71" y="152.44" width="74.47" height="39.56" viewBox="0 0 70 40" overflow="visible"><path d="M4 25 17 13l8 10 13-17 8 15 19-12"/></svg></g>
    <g class="spark three" transform="translate(209.46 60.51) rotate(194) scale(.78) translate(-209.46 -60.51)"><svg x="181.53" y="40.73" width="55.85" height="39.56" viewBox="0 0 70 40" overflow="visible"><path d="M4 25 17 13l8 10 13-17 8 15 19-12"/></svg></g>
  </g>
</svg>
